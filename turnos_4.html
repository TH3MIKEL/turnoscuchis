<style>
  :root{
    --font-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --font-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --font-mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
    --ink:#182420;
    --panel:#1f2f29;
    --panel2:#24362f;
    --paper:#f7f2e4;
    --paper-dim:#efe8d5;
    --line:#3c4d45;
    --line-soft:#4b5c53;
    --amber:#e6a13a;
    --amber-dim:#3a331f;
    --brick:#c65d43;
    --text-on-paper:#20211a;
    --text-dim-on-paper:#6c6656;
    --text-on-dark:#eee7d6;
    --text-dim-on-dark:#a9b3ac;
    --radius:10px;
    --palette-1:#e6a13a; --palette-2:#5b9bd9; --palette-3:#c65d43; --palette-4:#6fae7f;
    --palette-5:#b586d6; --palette-6:#d97ca8; --palette-7:#4fb8b0; --palette-8:#d0a24c;
    --palette-9:#7f8fd9; --palette-10:#dc8659; --palette-11:#68a8c9; --palette-12:#a3b25a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--ink);
    color:var(--text-on-dark);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:28px 20px 80px;}
  .topbar{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:22px;}
  .brand{display:flex;align-items:center;gap:14px;}
  .brand .logo{
    height:46px;width:auto;object-fit:contain;
    flex-shrink:0;display:none;
  }
  .brand .logo.show{display:block;}
  .brand h1{
    font-family:var(--font-display);
    font-weight:600;
    font-size:34px;
    margin:0;
    letter-spacing:-0.01em;
    color:var(--text-on-dark);
  }
  .brand .tag{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--amber);
    background:var(--amber-dim);
    border:1px solid #55491f;
    padding:4px 8px;
    border-radius:6px;
  }
  .status{font-size:12px;color:var(--text-dim-on-dark);font-family:var(--font-mono);}

  .weeknav{
    display:flex;align-items:center;gap:14px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px 16px;
    margin-bottom:18px;
  }
  .weeknav button.nav-arrow{
    width:34px;height:34px;border-radius:8px;border:1px solid var(--line-soft);
    background:var(--panel2);color:var(--text-on-dark);cursor:pointer;font-size:16px;
    display:flex;align-items:center;justify-content:center;transition:background .15s;
  }
  .weeknav button.nav-arrow:hover{background:var(--line-soft);}
  .weeknav .weeklabel{flex:1;text-align:center;}
  .weeknav .weeklabel .big{font-family:var(--font-display);font-size:19px;font-weight:600;}
  .weeknav .weeklabel .small{font-size:12px;color:var(--text-dim-on-dark);margin-top:2px;}
  .weeknav button.today{
    border:1px solid var(--line-soft);background:transparent;color:var(--text-dim-on-dark);
    border-radius:8px;padding:8px 12px;font-size:12px;cursor:pointer;
  }
  .weeknav button.today:hover{color:var(--text-on-dark);border-color:var(--amber);}

  .board{
    background:var(--paper);
    border-radius:14px;
    padding:4px;
    overflow-x:auto;
  }
  table.grid{border-collapse:collapse;width:100%;min-width:920px;}
  table.grid th, table.grid td{border:1px solid var(--paper-dim);vertical-align:top;}
  table.grid thead th{
    background:var(--paper);
    padding:10px 8px 8px;
    position:sticky;top:0;
  }
  .daycol-head{text-align:center;}
  .daycol-head .dname{
    font-family:var(--font-mono);
    font-size:11px;text-transform:uppercase;letter-spacing:.08em;
    color:var(--text-dim-on-paper);
  }
  .daycol-head .dnum{
    font-family:var(--font-display);font-weight:600;font-size:22px;color:var(--text-on-paper);
    margin-top:2px;
  }
  .shiftcol-head{
    width:130px;
    text-align:left;
    padding:10px 10px;
    font-family:var(--font-mono);
    font-size:11px;text-transform:uppercase;letter-spacing:.06em;
    color:var(--text-dim-on-paper);
  }
  .shift-row-label{
    padding:10px;
    background:var(--paper);
  }
  .shift-pill{
    display:inline-flex;align-items:center;gap:6px;
    background:#fff;border:1px solid var(--paper-dim);
    border-radius:999px;padding:4px 10px 4px 6px;
    font-family:var(--font-mono);font-size:12px;color:var(--text-on-paper);
  }
  .shift-dot{width:7px;height:7px;border-radius:50%;background:var(--amber);flex-shrink:0;}
  .shift-edit-btn{
    background:none;border:none;cursor:pointer;color:var(--text-dim-on-paper);
    font-size:12px;padding:2px 4px;margin-left:2px;
  }
  .shift-edit-btn:hover{color:var(--brick);}
  tr.special-row .shift-row-label{background:var(--paper-dim);}
  tr.special-row .shift-pill{background:transparent;border:none;padding:2px 0;color:var(--text-dim-on-paper);font-weight:600;}
  tr.special-row .shift-pill .shift-dot{background:var(--brick);}
  tr.special-row td.cell{background:#fbf8ef;}
  .spacer-row td{border:none;background:transparent;height:6px;padding:0;}
  .add-shift-row td{padding:8px 10px;background:var(--paper);}
  .add-shift-row button{
    background:transparent;border:1px dashed var(--text-dim-on-paper);
    color:var(--text-dim-on-paper);border-radius:8px;padding:6px 12px;
    font-size:12px;cursor:pointer;font-family:var(--font-body);
  }
  .add-shift-row button:hover{border-color:var(--brick);color:var(--brick);}

  td.cell{
    padding:6px;
    min-width:118px;
    background:#fff;
  }
  .chip-list{display:flex;flex-direction:column;gap:4px;margin-bottom:4px;}
  .chip{
    display:flex;align-items:center;gap:6px;
    background:var(--paper);
    border-radius:7px;
    padding:4px 6px;
    font-size:12.5px;
    color:var(--text-on-paper);
  }
  .chip .avatar{
    width:16px;height:16px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:8px;font-weight:600;color:#fff;flex-shrink:0;
  }
  .chip .cname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .chip .rm{
    background:none;border:none;cursor:pointer;color:var(--text-dim-on-paper);
    font-size:13px;line-height:1;padding:0 2px;
  }
  .chip .rm:hover{color:var(--brick);}
  .cell-add{width:100%;}
  .cell-add select{
    width:100%;
    font-size:12px;
    padding:4px 4px;
    border-radius:6px;
    border:1px dashed var(--paper-dim);
    background:#fff;
    color:var(--text-dim-on-paper);
    font-family:var(--font-body);
  }

  .totalrow th{
    background:var(--paper-dim);
    padding:8px 10px;
    font-family:var(--font-mono);
    font-size:11px;text-transform:uppercase;letter-spacing:.06em;
    color:var(--text-dim-on-paper);
    text-align:left;
  }
  .totalrow td{
    background:var(--paper-dim);
    text-align:center;
    font-family:var(--font-display);font-weight:600;font-size:18px;
    color:var(--text-on-paper);
    padding:8px;
  }

  .panel-row{display:flex;gap:16px;margin-top:20px;flex-wrap:wrap;}
  .panel{
    flex:1;min-width:300px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:16px 18px;
  }
  .panel h2{
    font-family:var(--font-display);font-weight:600;font-size:16px;margin:0 0 12px;
    color:var(--text-on-dark);
  }
  .panel .hint{font-size:12px;color:var(--text-dim-on-dark);margin:-6px 0 12px;}
  .emp-add{display:flex;gap:8px;margin-bottom:12px;}
  .emp-add input{
    flex:1;background:var(--panel2);border:1px solid var(--line-soft);
    color:var(--text-on-dark);border-radius:8px;padding:8px 10px;font-size:13px;
    font-family:var(--font-body);
  }
  .emp-add input:focus{outline:none;border-color:var(--amber);}
  .emp-add button{
    background:var(--amber);border:none;color:#241a05;font-weight:600;
    border-radius:8px;padding:0 16px;font-size:13px;cursor:pointer;
  }
  .emp-add button:hover{filter:brightness(1.08);}
  .emp-list{display:flex;flex-wrap:wrap;gap:8px;}
  .emp-tag{
    display:flex;align-items:center;gap:6px;
    background:var(--panel2);border:1px solid var(--line-soft);
    border-radius:999px;padding:5px 6px 5px 8px;font-size:12.5px;
  }
  .emp-tag .avatar{
    width:16px;height:16px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:8px;font-weight:600;color:#fff;flex-shrink:0;
  }
  .emp-tag button{background:none;border:none;color:var(--text-dim-on-dark);cursor:pointer;font-size:13px;padding:0 2px;}
  .emp-tag button:hover{color:var(--brick);}

  .foot{display:flex;justify-content:space-between;align-items:center;margin-top:22px;flex-wrap:wrap;gap:10px;}
  .foot button.reset{
    background:transparent;border:1px solid var(--line-soft);color:var(--text-dim-on-dark);
    border-radius:8px;padding:8px 14px;font-size:12px;cursor:pointer;
  }
  .foot button.reset:hover{border-color:var(--brick);color:var(--brick);}
  .foot .note{font-size:11px;color:var(--text-dim-on-dark);font-family:var(--font-mono);}

  .modal-bg{
    display:none;position:absolute;inset:0;background:rgba(10,14,12,.55);
    align-items:flex-start;justify-content:center;padding-top:80px;z-index:20;
  }
  .modal-bg.open{display:flex;}
  .modal{
    background:var(--panel);border:1px solid var(--line-soft);border-radius:12px;
    padding:18px 20px;width:280px;
  }
  .modal h3{margin:0 0 12px;font-family:var(--font-display);font-size:16px;}
  .modal label{display:block;font-size:11px;color:var(--text-dim-on-dark);margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em;font-family:var(--font-mono);}
  .modal input{
    width:100%;background:var(--panel2);border:1px solid var(--line-soft);
    color:var(--text-on-dark);border-radius:8px;padding:8px 10px;font-size:13px;margin-bottom:10px;
    font-family:var(--font-body);
  }
  .modal input:focus{outline:none;border-color:var(--amber);}
  .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:6px;}
  .modal-actions button{border-radius:8px;padding:7px 14px;font-size:12px;cursor:pointer;border:1px solid var(--line-soft);}
  .modal-actions .cancel{background:transparent;color:var(--text-dim-on-dark);}
  .modal-actions .save{background:var(--amber);color:#241a05;font-weight:600;border:none;}
  .modal-actions .danger{background:transparent;color:var(--brick);border-color:var(--brick);margin-right:auto;}

  .relwrap{position:relative;}

  .signsheet{display:none;}
  @media print{
    .signsheet{
      display:block;
      margin-top:16px;
      page-break-before:always;
    }
    .signsheet h2{
      font-family:var(--font-display);font-size:18px;color:#111;margin:0 0 4px;
    }
    .signsheet .sub{font-size:11px;color:#555;margin:0 0 10px;}
    table.signgrid{border-collapse:collapse;width:100%;}
    table.signgrid th, table.signgrid td{border:1px solid #ccc;padding:0;}
    table.signgrid thead th{
      background:#f4f4f4;padding:6px 6px;text-align:center;
      font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:#444;
    }
    table.signgrid thead th:first-child{text-align:left;padding-left:10px;}
    table.signgrid tbody td.empname{
      padding:8px 10px;font-size:13px;color:#111;white-space:nowrap;
    }
    table.signgrid tbody td.signbox{ height:34px; }
    table.signgrid tbody tr{page-break-inside:avoid;}
  }

  @media (max-width:640px){
    .brand h1{font-size:26px;}
    .board{border-radius:10px;}
  }

  @media print{
    @page{ size:A4 landscape; margin:12mm; }
    body{ background:#fff; color:#111; }
    .wrap{ max-width:none; padding:0; }
    .status, .weeknav .nav-arrow, #gotoToday, #printBtn,
    .panel-row, .foot, .add-shift-row, .cell-add, .rm, .shift-edit-btn,
    .modal-bg{ display:none !important; }
    .topbar{ margin-bottom:10px; }
    .brand .logo{ height:38px; }
    .brand h1{ color:#111; font-size:24px; }
    .brand .tag{ background:none; border:1px solid #999; color:#555; }
    .weeknav{ background:none; border:none; padding:0 0 8px; }
    .weeknav .weeklabel .big{ color:#111; }
    .weeknav .weeklabel .small{ color:#555; }
    .board{ background:#fff; padding:0; }
    table.grid{ min-width:0; width:100%; }
    table.grid th, table.grid td{ border:1px solid #ccc; }
    thead th{ background:#fff !important; }
    .shift-row-label{ background:#f4f4f4 !important; }
    .shift-pill{ color:#111; }
    .shift-dot{ background:#111 !important; }
    td.cell{ background:#fff !important; }
    .chip{ background:#f0f0f0; color:#111; break-inside:avoid; }
    .chip .rm{ display:none; }
    .totalrow th, .totalrow td{ background:#eee !important; color:#111; }
    tr.special-row .shift-row-label{ background:#f4f4f4 !important; }
    tr.special-row td.cell{ background:#fdfdfd !important; }
    table.grid, tbody, tr{ page-break-inside:avoid; }
  }
</style>
</head>

</div>

    <h3 id="shiftModalTitle">Franja horaria</h3>
    <label for="shiftLabelInput">Nombre</label>
    <input type="text" id="shiftLabelInput" placeholder="p.ej. Turno mañana" maxlength="20">
    <label for="shiftStartInput">Entrada</label>

    <label for="shiftEndInput">Salida</label>

      <button class="cancel" id="shiftCancelBtn">Cancelar</button>
      <button class="save" id="shiftSaveBtn">Guardar</button>
    </div>
  </div>
</div>

<script>
(function(){
  var PALETTE = ['var(--palette-1)','var(--palette-2)','var(--palette-3)','var(--palette-4)','var(--palette-5)','var(--palette-6)','var(--palette-7)','var(--palette-8)','var(--palette-9)','var(--palette-10)','var(--palette-11)','var(--palette-12)'];
  var DAY_NAMES = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
  var MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

  var DEFAULT_EMPLOYEES = ['Salva','Carlos','Sabrina','Stephen','Kevin','Yenifer','Miguel','Mónica','Pablo','Antonio','Jaime','Frank','Fabio','Gastón','Felipe'];
  var DEFAULT_SHIFTS = [
    {id:'s1', label:'Turno 1', start:'11:00', end:'20:00'},
    {id:'s2', label:'Turno 2', start:'12:00', end:'21:00'},
    {id:'s3', label:'Turno 3', start:'13:00', end:'22:00'},
    {id:'s4', label:'Turno 4', start:'13:30', end:'22:30'},
    {id:'s5', label:'Turno 5', start:'14:00', end:'23:00'}
  ];

  var state = {
    employees: [],
    shifts: [],
    weekStart: mondayOf(new Date()),
    assignments: {}
  };

  var editingShiftId = null;

  function mondayOf(d){
    var dt = new Date(d);
    var day = dt.getDay();
    var diff = (day === 0 ? -6 : 1) - day;
    dt.setDate(dt.getDate() + diff);
    dt.setHours(0,0,0,0);
    return dt;
  }
  function fmtDate(d){
    var y = d.getFullYear();
    var m = String(d.getMonth()+1).padStart(2,'0');
    var day = String(d.getDate()).padStart(2,'0');
    return y+'-'+m+'-'+day;
  }
  function parseDate(s){
    var parts = s.split('-');
    return new Date(parseInt(parts[0]),parseInt(parts[1])-1,parseInt(parts[2]));
  }
  function weekKey(d){ return fmtDate(d); }
  function addDays(d,n){ var dt = new Date(d); dt.setDate(dt.getDate()+n); return dt; }
  function initials(name){
    var parts = name.trim().split(/\s+/);
    if(parts.length===1) return parts[0].slice(0,2).toUpperCase();
    return (parts[0][0]+parts[1][0]).toUpperCase();
  }
  function colorFor(id){
    var sum = 0;
    for(var i=0;i<id.length;i++) sum += id.charCodeAt(i);
    return PALETTE[sum % PALETTE.length];
  }
  function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,9); }

  function setStatus(text){ document.getElementById('statusLine').textContent = text; }
  function setSaveNote(text, isErr){
    var el = document.getElementById('saveNote');
    el.textContent = text;
    el.style.color = isErr ? 'var(--brick)' : '';
  }

  function hasCloudStorage(){
    return typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function';
  }
  function localKey(key){ return 'turnos_app:' + key; }

  async function storageGet(key){
    if(hasCloudStorage()){
      try{
        var res = await window.storage.get(key, true);
        if(res) return JSON.parse(res.value);
      }catch(e){ /* fall through to local */ }
    }
    try{
      var raw = localStorage.getItem(localKey(key));
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  }

  async function storageSet(key, value){
    var cloudOk = false;
    if(hasCloudStorage()){
      try{
        var res = await window.storage.set(key, JSON.stringify(value), true);
        cloudOk = !!res;
      }catch(e){ cloudOk = false; }
    }
    var localOk = false;
    try{
      localStorage.setItem(localKey(key), JSON.stringify(value));
      localOk = true;
    }catch(e){ localOk = false; }

    if(cloudOk){
      setSaveNote('los cambios se guardan solos');
      return true;
    }
    if(localOk){
      setSaveNote('guardado en este celular');
      return true;
    }
    setSaveNote('no se pudo guardar', true);
    return false;
  }

  async function loadAll(){
    setStatus('cargando…');
    var emp = await storageGet('employees');
    var shf = await storageGet('shifts');
    state.employees = emp || DEFAULT_EMPLOYEES.map(function(n){ return {id: uid('e'), name:n}; });
    state.shifts = shf || DEFAULT_SHIFTS.slice();
    if(!emp) await storageSet('employees', state.employees);
    if(!shf) await storageSet('shifts', state.shifts);
    await loadWeek();
    setStatus('');
  }

  async function loadWeek(){
    var key = 'week:' + weekKey(state.weekStart);
    var wk = await storageGet(key);
    state.assignments = wk || {};
    render();
  }

  async function saveWeek(){
    var key = 'week:' + weekKey(state.weekStart);
    await storageSet(key, state.assignments);
  }

  function getCellPeople(shiftId, dayIdx){
    if(!state.assignments[shiftId]) return [];
    return state.assignments[shiftId][dayIdx] || [];
  }
  function setCellPeople(shiftId, dayIdx, arr){
    if(!state.assignments[shiftId]) state.assignments[shiftId] = {};
    state.assignments[shiftId][dayIdx] = arr;
  }

  function renderSignSheet(){
    var start = state.weekStart;
    var end = addDays(start,6);
    document.getElementById('signSheetSub').textContent =
      'Del ' + start.getDate() + ' al ' + end.getDate() + ' de ' + MONTHS[end.getMonth()] + ' — firma cada día trabajado';

    var headHtml = '<th>Empleado</th>';
    for(var i=0;i<7;i++){
      var d = addDays(start,i);
      headHtml += '<th>'+DAY_NAMES[i].slice(0,3)+' '+d.getDate()+'</th>';
    }
    document.getElementById('signHeadRow').innerHTML = headHtml;

    var bodyHtml = '';
    state.employees.forEach(function(e){
      bodyHtml += '<tr><td class="empname">'+escapeHtml(e.name)+'</td>';
      for(var i=0;i<7;i++){ bodyHtml += '<td class="signbox"></td>'; }
      bodyHtml += '</tr>';
    });
    document.getElementById('signBodyRows').innerHTML = bodyHtml ||
      '<tr><td class="empname" colspan="8">todavía no hay empleados cargados</td></tr>';
  }

  function render(){
    renderWeekLabel();
    renderHead();
    renderBody();
    renderTotals();
    renderEmployees();
    renderShiftOptions();
    renderSignSheet();
  }

  function renderWeekLabel(){
    var start = state.weekStart;
    var end = addDays(start,6);
    var big = 'Del ' + start.getDate() + ' al ' + end.getDate() + ' de ' + MONTHS[end.getMonth()];
    var small = start.getFullYear();
    if(start.getMonth() !== end.getMonth()){
      big = 'Del ' + start.getDate() + ' ' + MONTHS[start.getMonth()].slice(0,3) + ' al ' + end.getDate() + ' ' + MONTHS[end.getMonth()].slice(0,3);
    }
    document.getElementById('weekBig').textContent = big;
    document.getElementById('weekSmall').textContent = small;
  }

  function renderHead(){
    var tr = document.getElementById('headRow');
    var html = '<th class="shiftcol-head">horario</th>';
    for(var i=0;i<7;i++){
      var d = addDays(state.weekStart,i);
      html += '<th class="daycol-head"><div class="dname">'+DAY_NAMES[i]+'</div><div class="dnum">'+d.getDate()+'</div></th>';
    }
    tr.innerHTML = html;
  }

  var SPECIAL_ROWS = [
    {id:'baja', label:'De baja'},
    {id:'vacaciones', label:'Vacaciones'}
  ];

  function renderRow(id, label, sublabel, isSpecial){
    var html = '<tr' + (isSpecial ? ' class="special-row"' : '') + '>';
    html += '<td class="shift-row-label">' +
      '<span class="shift-pill"><span class="shift-dot"></span>' + escapeHtml(label) +
      (isSpecial ? '' : '<button class="shift-edit-btn" data-editshift="'+id+'" aria-label="Editar franja">&#9998;</button>') +
      '</span>';
    if(sublabel){
      html += '<div style="font-family:var(--font-mono);font-size:11px;color:var(--text-dim-on-paper);margin-top:5px;">'+sublabel+'</div>';
    }
    html += '</td>';
    for(var i=0;i<7;i++){
      var people = getCellPeople(id, i);
      html += '<td class="cell" data-shift="'+id+'" data-day="'+i+'">';
      html += '<div class="chip-list">';
      people.forEach(function(pid){
        var emp = state.employees.find(function(e){ return e.id===pid; });
        if(!emp) return;
        html += '<div class="chip"><span class="avatar" style="background:'+colorFor(emp.id)+'">'+initials(emp.name)+'</span>' +
          '<span class="cname">'+escapeHtml(emp.name)+'</span>' +
          '<button class="rm" data-rm-shift="'+id+'" data-rm-day="'+i+'" data-rm-emp="'+pid+'" aria-label="Quitar">&times;</button></div>';
      });
      html += '</div>';
      html += '<div class="cell-add"><select data-add-shift="'+id+'" data-add-day="'+i+'"><option value="">+ agregar…</option></select></div>';
      html += '</td>';
    }
    html += '</tr>';
    return html;
  }

  function renderBody(){
    var tbody = document.getElementById('gridBody');
    var html = '';
    state.shifts.forEach(function(shift){
      html += renderRow(shift.id, shift.label, shift.start+' – '+shift.end, false);
    });
    html += '<tr class="spacer-row"><td colspan="8"></td></tr>';
    SPECIAL_ROWS.forEach(function(row){
      html += renderRow(row.id, row.label, null, true);
    });
    tbody.innerHTML = html;
    populateAddSelects();
  }

  function populateAddSelects(){
    var selects = document.querySelectorAll('select[data-add-shift]');
    selects.forEach(function(sel){
      var shiftId = sel.getAttribute('data-add-shift');
      var day = sel.getAttribute('data-add-day');
      var already = getCellPeople(shiftId, day);
      var opts = '<option value="">+ agregar…</option>';
      state.employees.forEach(function(e){
        if(already.indexOf(e.id) === -1){
          opts += '<option value="'+e.id+'">'+escapeHtml(e.name)+'</option>';
        }
      });
      sel.innerHTML = opts;
    });
  }

  function renderTotals(){
    var tr = document.getElementById('totalRow');
    var html = '<th>total / día</th>';
    for(var i=0;i<7;i++){
      var count = 0;
      state.shifts.forEach(function(shift){
        count += getCellPeople(shift.id, i).length;
      });
      html += '<td>'+count+'</td>';
    }
    tr.innerHTML = html;
  }

  function renderEmployees(){
    var el = document.getElementById('empList');
    var html = '';
    state.employees.forEach(function(e){
      html += '<div class="emp-tag"><span class="avatar" style="background:'+colorFor(e.id)+'">'+initials(e.name)+'</span>' +
        escapeHtml(e.name) +
        '<button data-rmemp="'+e.id+'" aria-label="Eliminar empleado">&times;</button></div>';
    });
    el.innerHTML = html || '<span style="color:var(--text-dim-on-dark);font-size:13px;">todavía no hay empleados</span>';
  }

  function renderShiftOptions(){}

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  document.getElementById('prevWeek').addEventListener('click', async function(){
    state.weekStart = addDays(state.weekStart,-7);
    await loadWeek();
  });
  document.getElementById('nextWeek').addEventListener('click', async function(){
    state.weekStart = addDays(state.weekStart,7);
    await loadWeek();
  });
  document.getElementById('gotoToday').addEventListener('click', async function(){
    state.weekStart = mondayOf(new Date());
    await loadWeek();
  });
  document.getElementById('printBtn').addEventListener('click', function(){
    window.print();
  });

  document.getElementById('addEmpBtn').addEventListener('click', addEmployee);
  document.getElementById('newEmpName').addEventListener('keydown', function(e){
    if(e.key === 'Enter') addEmployee();
  });
  async function addEmployee(){
    var input = document.getElementById('newEmpName');
    var name = input.value.trim();
    if(!name) return;
    state.employees.push({id: uid('e'), name: name});
    input.value = '';
    render();
    await storageSet('employees', state.employees);
  }

  document.getElementById('empList').addEventListener('click', async function(e){
    var btn = e.target.closest('button[data-rmemp]');
    if(!btn) return;
    var id = btn.getAttribute('data-rmemp');
    var emp = state.employees.find(function(x){return x.id===id;});
    if(!confirm('Eliminar a '+ (emp? emp.name : 'este empleado') +'? Se quitará de todos los turnos de esta semana.')) return;
    state.employees = state.employees.filter(function(x){ return x.id !== id; });
    Object.keys(state.assignments).forEach(function(shiftId){
      Object.keys(state.assignments[shiftId]).forEach(function(day){
        state.assignments[shiftId][day] = state.assignments[shiftId][day].filter(function(pid){ return pid !== id; });
      });
    });
    render();
    await storageSet('employees', state.employees);
    await saveWeek();
  });

  document.getElementById('gridBody').addEventListener('change', async function(e){
    var sel = e.target.closest('select[data-add-shift]');
    if(!sel) return;
    var val = sel.value;
    if(!val) return;
    var shiftId = sel.getAttribute('data-add-shift');
    var day = sel.getAttribute('data-add-day');
    var people = getCellPeople(shiftId, day).slice();
    if(people.indexOf(val) === -1) people.push(val);
    setCellPeople(shiftId, day, people);
    render();
    await saveWeek();
  });

  document.getElementById('gridBody').addEventListener('click', async function(e){
    var btn = e.target.closest('button[data-rm-shift]');
    if(!btn) return;
    var shiftId = btn.getAttribute('data-rm-shift');
    var day = btn.getAttribute('data-rm-day');
    var pid = btn.getAttribute('data-rm-emp');
    var people = getCellPeople(shiftId, day).filter(function(x){ return x !== pid; });
    setCellPeople(shiftId, day, people);
    render();
    await saveWeek();
  });

  document.getElementById('gridBody').addEventListener('click', function(e){
    var btn = e.target.closest('button[data-editshift]');
    if(!btn) return;
    openShiftModal(btn.getAttribute('data-editshift'));
  });

  document.getElementById('addShiftBtn').addEventListener('click', function(){
    openShiftModal(null);
  });

  function openShiftModal(shiftId){
    editingShiftId = shiftId;
    var bg = document.getElementById('shiftModalBg');
    var title = document.getElementById('shiftModalTitle');
    var labelInput = document.getElementById('shiftLabelInput');
    var startInput = document.getElementById('shiftStartInput');
    var endInput = document.getElementById('shiftEndInput');
    var delBtn = document.getElementById('shiftDeleteBtn');
    if(shiftId){
      var shift = state.shifts.find(function(s){return s.id===shiftId;});
      title.textContent = 'Editar franja horaria';
      labelInput.value = shift.label;
      startInput.value = shift.start;
      endInput.value = shift.end;
      delBtn.style.display = 'inline-block';
    }else{
      title.textContent = 'Nueva franja horaria';
      labelInput.value = 'Turno ' + (state.shifts.length+1);
      startInput.value = '12:00';
      endInput.value = '20:00';
      delBtn.style.display = 'none';
    }
    bg.classList.add('open');
  }
  function closeShiftModal(){
    document.getElementById('shiftModalBg').classList.remove('open');
    editingShiftId = null;
  }
  document.getElementById('shiftCancelBtn').addEventListener('click', closeShiftModal);
  document.getElementById('shiftModalBg').addEventListener('click', function(e){
    if(e.target === e.currentTarget) closeShiftModal();
  });

  document.getElementById('shiftSaveBtn').addEventListener('click', async function(){
    var label = document.getElementById('shiftLabelInput').value.trim() || 'Turno';
    var start = document.getElementById('shiftStartInput').value || '12:00';
    var end = document.getElementById('shiftEndInput').value || '20:00';
    if(editingShiftId){
      var shift = state.shifts.find(function(s){return s.id===editingShiftId;});
      shift.label = label; shift.start = start; shift.end = end;
    }else{
      state.shifts.push({id: uid('s'), label:label, start:start, end:end});
    }
    closeShiftModal();
    render();
    await storageSet('shifts', state.shifts);
  });

  document.getElementById('shiftDeleteBtn').addEventListener('click', async function(){
    if(!editingShiftId) return;
    if(!confirm('Eliminar esta franja horaria de todas las semanas?')) return;
    state.shifts = state.shifts.filter(function(s){ return s.id !== editingShiftId; });
    delete state.assignments[editingShiftId];
    closeShiftModal();
    render();
    await storageSet('shifts', state.shifts);
    await saveWeek();
  });

  document.getElementById('resetWeekBtn').addEventListener('click', async function(){
    if(!confirm('Vaciar todas las asignaciones de esta semana?')) return;
    state.assignments = {};
    render();
    await saveWeek();
  });

  loadAll();
})();
</script>
</body>
</html>
